<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estação 1 - Casa Aberta DS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container estruturado para manter a imagem nítida e sem distorções -->
    <div class="bg-wrapper">
        <img src="imagem/ds.png" alt="Background Casa Aberta DS">
    </div>

    <!-- Sua Interface Central -->
    <main class="container">
        <p class="estacao">DS STATION</p>
        <h1 class="titulo">DEV STATION</h1>

        <div class="painel">
            <p class="label">Recebimento dos caracteres da sala</p>
            
            <button id="buscarBtn" class="btn">BUSCAR CÓDIGO</button>

            <div id="codigoContainer" class="codigo carregando">
                <span id="caractere1">?</span>
                <span id="caractere2">?</span>
            </div>

            <button id="concluirBtn" class="btn hidden">CONCLUIR TERMINAL</button>

            <div id="status" class="status hidden"></div>
            <div id="aguarde" class="aguarde hidden"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
